<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendSmart - Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendSmart</h1>
        <p>Track your expenses. Manage your money.</p>
    </header>

    <main class="container">

        <section class="summary">
            <div class="summary-card">
                <h3>Total Expenses</h3>
                <h2 id="totalAmount">PKR 0</h2>
            </div>
        </section>

        <section class="expense-section">

            <div class="form-card">
                <h2>Add New Expense</h2>

                <form id="expenseForm">

                    <label for="title">Expense Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="e.g. Lunch"
                        required
                    >

                    <label for="amount">Amount (PKR)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >

                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Education">Education</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>

                    <label for="date">Date</label>
                    <input type="date" id="date" required>

                    <button type="submit">Add Expense</button>

                </form>
            </div>

            <div class="expense-list-card">
                <h2>Expense History</h2>

                <div id="expenseList">
                    <p class="empty-message">No expenses added yet.</p>
                </div>
            </div>

        </section>

        <section class="category-section">

            <h2>Category-wise Spending</h2>

            <div id="categorySummary">
                <p>No spending data available.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>SpendSmart | Developed by Code Crafters</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
